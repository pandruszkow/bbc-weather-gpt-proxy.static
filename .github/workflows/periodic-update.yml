name: Scheduled script to grab, transform and publish latest weather

on:
  workflow_dispatch: # Manual run
  push:
    branches:
      - main
  schedule:
    - cron: "59 */2 * * *"  # Run every 2 hours

jobs:
  # GitHub auto-disables scheduled workflows in public repos after 60 days
  # without repository activity. That is what froze the feed on 2026-07-02
  # (last commit 2026-05-03, +60 days). Calling the "enable workflow" API
  # resets the 60-day baseline without polluting history with dummy commits
  # (same mechanism as gautamkrishnar/keepalive-workflow's default API mode).
  # Separate job, so a broken scrape can't also kill the keepalive.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Reset the 60-day inactivity timer
        run: gh workflow enable periodic-update.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Set timezone to UK
        run: sudo timedatectl set-timezone Europe/London
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Generate weather forecasts
        run: |
          python main.py
          python make_index_page.py
        env:
          WEATHER_BATCH_OUTPUT: _output
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _output
          
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4